name: Build and Release

# The only workflow: runs on pushes to main (dev pushes and pull requests don't build).
# Every run builds Foyer.app. When the version in Sources/Foyer/About.swift has no v<version> tag
# yet, it also creates the tag and publishes the GitHub Release with the zip, its SHA-256 and that
# version's CHANGELOG.md section. If the build fails, nothing is tagged or published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, to tell whether this version is already released

      - name: Read version
        id: version
        run: |
          VERSION="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/Foyer/About.swift | head -1)"
          if [ -z "$VERSION" ]; then echo "No version in About.swift"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION"
          fi

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-app.sh "$VERSION"

      - name: Publish release
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="$(awk -v v="$VERSION" '
            /^## \[/ { show = index($0, "[" v "]") > 0; next }
            show' CHANGELOG.md)"
          gh release create "v$VERSION" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "Foyer $VERSION" \
            --notes "${NOTES:-See CHANGELOG.md}"
