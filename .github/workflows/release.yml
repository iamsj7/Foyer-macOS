name: Release

# Push a tag like v0.1.0 to build Foyer.app and publish a GitHub Release with the zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Package
        run: scripts/package-app.sh "${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(awk '/^## \[/{n++} n==1' CHANGELOG.md | tail -n +2)"
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes "${NOTES:-See CHANGELOG.md}"
